extends: ../common/franka.yaml

# The merged force RLT server uses port 8002; the legacy EE policy can be selected with --port 8001.
# Force RLT runs in hold/shadow mode until joint execution is explicitly configured.
policy_server:
  host: "127.0.0.1"
  port: 8002

inference:
  prompt: "Place the object into the basket"
  action_fps: 30.0
  replan_every_steps: 8
  max_steps: 600
  max_ee_translation_step_m: 0.03
  max_ee_rotation_step_rad: 0.15
  max_camera_age_s: 0.2
  move_to_start: false

camera:
  camera_backend: ros
  image_hw: 224

robot:
  use_fake_hardware: true

motion:
  ee:
    enabled: true
    streaming:
      publish_rate_hz: 30.0
      limits:
        max_translation_step_m: 0.03
        max_rotation_step_rad: 0.15
  joint:
    streaming:
      enabled: true
  gripper:
    enabled: true

force_rlt:
  execute_joint_targets: false
  max_ref_age_s: 0.2
