# Inference for openpi-force's pi0_base_ee_ros_30hz checkpoint.
# Run the policy server separately; this process never writes a dataset.
policy_server:
  host: "127.0.0.1"
  port: 8001

inference:
  prompt: "Place the object into the basket"
  action_fps: 30.0
  replan_every_steps: 8
  max_steps: 600
  max_ee_translation_step_m: 0.03
  max_ee_rotation_step_rad: 0.15
  max_camera_age_s: 0.2
  move_to_start: false

camera:
  camera_backend: ros
  external_camera_serial: "825412070292"
  wrist_camera_serial: "825412070487"
  external_image_topic: "/external/color/image_raw"
  wrist_image_topic: "/wrist/color/image_raw"
  camera_startup_timeout_s: 10.0
  image_hw: 224
  crop_scale: 0.9
  camera_fps: 30.0

robot:
  use_fake_hardware: true
  robot_type: fr3
  start_joint_position:
    - 0.00388
    - -0.45916
    - -0.15237
    - -2.47266
    - -0.06778
    - 1.96442
    - 0.70214

gripper:
  gripper_type: franka
