extends: ../common/franka.yaml

# Franka Human in the Loop collection config. Later robots: config/hitl/<robot>.yaml
# Any compatible policy server can supply actions over the policy WebSocket.
# Selectors:
#   control.control_mode: ee | joint
#   gripper.gripper_type: franka | dh5 | none

policy_server:
  host: "127.0.0.1"
  port: 8001

transition_server:
  enabled: false # optional live replay/learning service
  host: "127.0.0.1"
  port: 8002

recording:
  enabled: true
  output_dir: "data/hitl"

camera:
  camera_backend: none # ros | none
  image_hw: 128

vr:
  # Policy runs by default; hold both VR triggers to take over (same deadman as collection).
  enable_vr: true
  vr_pose_topic: "/xr/controller_right/pose"
  vr_left_joy_topic: "/xr/controller_left/joy"
  vr_right_joy_topic: "/xr/controller_right/joy"
  vr_assume_arm_enabled: false
  vr_long_press_s: 0.5
  vr_translation_scale: 0.004
  vr_rotation_scale: 0.01
  vr_max_translation_step: 0.002
  vr_max_rotation_step: 0.004
  vr_translation_limit: 0.5
  vr_rotation_limit: 1.2
  vr_sensitivity: 1.0
  vr_enable_rotation: true

control:
  control_mode: ee # ee | joint
  fps: 100.0
  policy_fps: 30.0
  control_time_s: 20.0
  reset_time_s: 5.0
  end_effector_bounds:
    min: [0.20, -0.35, 0.05]
    max: [0.70, 0.35, 0.55]
  end_effector_step_sizes:
    x: 0.002
    y: 0.002
    z: 0.002

robot:
  use_fake_hardware: true

motion:
  ee:
    enabled: true
    streaming:
      publish_rate_hz: 100.0
  joint:
    streaming:
      enabled: true
  gripper:
    enabled: true

gripper:
  soft_gripper_use_fake: false
  gripper_left_image_topic: "/gripper_left/image_raw"
  gripper_right_image_topic: "/gripper_right/image_raw"
  enable_soft_gripper_cameras: false
  soft_gripper_force: 50
  soft_gripper_velocity: 100
  soft_gripper_axis_threshold: 0.55
  soft_gripper_step_interval: 0.08
