extends: ../common/franka.yaml

# Franka collection config. Later robots: config/collect/<robot>.yaml
# Selectors:
#   control.control_mode: ee | joint
#   gripper.gripper_type: franka | dh5 | none

dataset:
  lerobot_format: v2 # v2: Humble / LeRobot 0.1; v3: Jazzy / LeRobot 0.6.1
  repo_id: "openpi/franka_lerobot"
  date: "test"
  action_space: ee # ee: 6D base-frame pose + gripper (7D); joint: 7 joints + gripper (8D)
  instruction: "Place the object into the basket"
  label: "stop" # straight | detour | none | stop
  enable_logging: true
  max_duration_s: 3600.0

camera:
  camera_backend: ros # ros | none
  camera_width: 640
  camera_height: 480
  color_only: true
  camera_timeout_ms: 1000
  image_hw: 224

vr:
  vr_pose_topic: "/xr/controller_right/pose"
  vr_left_joy_topic: "/xr/controller_left/joy"
  vr_right_joy_topic: "/xr/controller_right/joy"
  vr_assume_arm_enabled: false
  vr_long_press_s: 0.5
  # Keep the old gain while limiting each 10 ms target change to the old speed.
  vr_translation_scale: 0.008
  vr_rotation_scale: 0.02
  vr_enable_rotation: true

control:
  control_mode: ee # ee | joint
  control_frequency: 100.0
  sensitivity: 1.0
  action_epsilon: 0.000001
  max_ee_translation_step: 0.008
  max_ee_rotation_step: 0.008
  motion_start_threshold: 0.0002
  max_ee_translation: 0.5
  max_ee_rotation: 1.2

# Online interfaces required by collection. Limits here are target guards;
# control.max_ee_* above tunes the VR mapper (per axis).
motion:
  ee:
    enabled: true
    streaming:
      publish_rate_hz: 100.0
      limits:
        max_translation_step_m: 0.02
        max_rotation_step_rad: 0.02
        max_translation_m: 0.9
        max_rotation_rad: 2.1
  joint:
    streaming:
      enabled: true
  gripper:
    enabled: true

robot:
  use_fake_hardware: false

gripper:
  soft_gripper_use_fake: false
  soft_gripper_port: "/dev/ttyUSB0"
  gripper_left_image_topic: "/gripper_left/image_raw"
  gripper_right_image_topic: "/gripper_right/image_raw"
  enable_soft_gripper_cameras: true
  soft_gripper_force: 50
  soft_gripper_velocity: 100
  soft_gripper_axis_threshold: 0.55
  soft_gripper_step_interval: 0.08

reactive_desk:
  reactive_desk_enabled: false
  reactive_desk_host: "127.0.0.1"
  reactive_desk_port: 8000
  reactive_desk_path: "/ws/VlaIngest"
