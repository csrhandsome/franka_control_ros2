# ROS-native parameters for the pinned LCAS Panda driver and project controllers.
/**/controller_manager:
  ros__parameters:
    update_rate: 1000
    cartesian_pose_target_controller:
      type: data_collect_franka/CartesianPoseTargetController
    joint_position_target_controller:
      type: data_collect_franka/JointPositionTargetController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

/**/cartesian_pose_target_controller:
  ros__parameters:
    base_frame: panda_link0
    filter_coeff: 0.35
    max_translation_velocity: 0.05
    max_rotation_velocity: 0.2
    max_translation_acceleration: 0.1
    max_translation_jerk: 1.0
    max_rotation_acceleration: 0.2
    max_rotation_jerk: 2.0
    smoothing_frequency: 10.0

/**/joint_position_target_controller:
  ros__parameters:
    arm_prefix: ""
    robot_type: panda
    max_joint_velocity: 0.8

/**/franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda
    frequency: 100
