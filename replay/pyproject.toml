[project]
name = "franka-replay"
version = "0.1.0"
description = "Local LeRobot v2/v3 dataset replay workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pyarrow>=18,<24",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "imageio-ffmpeg>=0.6,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
